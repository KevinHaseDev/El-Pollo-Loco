<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">
    <script src="./classes/drawable_object.class.js"></script>
    <script src="./classes/movable_object.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/small_chicken.class.js"></script>
    <script src="./classes/status_bar.class.js"></script>
    <script src="./classes/endboss-status-bar.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/health_bar.class.js"></script>
    <script src="./classes/coin_bar.class.js"></script>
    <script src="./classes/bottle_bar.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./classes/background_object.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/throwable_object.class.js"></script>
    <script src="./classes/spawner.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./levels/level_one.js"></script>
    <script src="./game.js"></script>
</head>

<body>

    <!-- Portrait Mode Overlay: shown only when device is in portrait orientation -->
    <div id="portrait-overlay" class="portrait_overlay">
        <div class="portrait_content">
            <div class="rotate_icon">📱 ↻</div>
            <h2>Bitte drehe dein Gerät</h2>
            <p>Dieses Spiel wird nur im Querformat unterstützt</p>
        </div>
    </div>

    <div class="game_area">
        <canvas id="canvas" width="720" height="480"></canvas>

        <button id="retry-button" class="game_button" aria-hidden="true">Retry</button>

        <div id="start-screen" class="start_screen">
            <img src="./assets/img/9_intro_outro_screens/start/Copilot_20260124_134246.jpg" alt="Start Screen">
            <button id="start-button" class="game_button">Start Game</button>
        </div>

        <div class="mobile_controls" id="mobile-controls">
            <div class="mobile_controls_left">
                <button class="mobile_btn" id="btn-left" aria-label="Move Left">◄</button>
                <button class="mobile_btn" id="btn-right" aria-label="Move Right">►</button>
            </div>
            <div class="mobile_controls_right">
                <button class="mobile_btn" id="btn-jump" aria-label="Jump">▲</button>
                <button class="mobile_btn" id="btn-throw" aria-label="Throw">●</button>
            </div>
        </div>
    </div>

</body>

</html>
